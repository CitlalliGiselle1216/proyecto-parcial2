<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captura de Datos</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Estilos personalizados adicionales para un toque más llamativo */
    body {
      background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 50%, #f472b6 100%);
      min-height: 100vh;
    }
  </style>
</head>
<body class="text-slate-800 font-sans flex flex-col items-center py-10 px-4">

  <div class="w-full max-w-3xl bg-white/95 backdrop-blur-md shadow-2xl rounded-3xl p-6 md:p-10 border border-pink-200">
    
    <h2 class="text-3xl font-extrabold text-pink-600 mb-6 text-center tracking-wide drop-shadow-sm">💖 Captura de Datos 💖</h2>

    <form id="formulario" class="space-y-4">
      <input type="hidden" id="id">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="edad" class="block text-sm font-semibold text-pink-700 mb-1">Edad:</label>
          <input type="number" id="edad" required min="1" max="120" class="w-full px-4 py-2.5 border-2 border-pink-200 rounded-xl focus:ring-4 focus:ring-pink-300 focus:border-pink-500 focus:outline-none transition bg-pink-50/30">
        </div>

        <div>
          <label for="celular" class="block text-sm font-semibold text-pink-700 mb-1">Celular:</label>
          <input type="text" id="celular" required class="w-full px-4 py-2.5 border-2 border-pink-200 rounded-xl focus:ring-4 focus:ring-pink-300 focus:border-pink-500 focus:outline-none transition bg-pink-50/30">
        </div>

        <div>
          <label for="computadora" class="block text-sm font-semibold text-pink-700 mb-1">Computadora:</label>
          <input type="text" id="computadora" required class="w-full px-4 py-2.5 border-2 border-pink-200 rounded-xl focus:ring-4 focus:ring-pink-300 focus:border-pink-500 focus:outline-none transition bg-pink-50/30">
        </div>

        <div>
          <label for="tablet" class="block text-sm font-semibold text-pink-700 mb-1">Tablet:</label>
          <input type="text" id="tablet" required class="w-full px-4 py-2.5 border-2 border-pink-200 rounded-xl focus:ring-4 focus:ring-pink-300 focus:border-pink-500 focus:outline-none transition bg-pink-50/30">
        </div>

        <div>
          <label for="internet" class="block text-sm font-semibold text-pink-700 mb-1">Internet:</label>
          <input type="text" id="internet" required class="w-full px-4 py-2.5 border-2 border-pink-200 rounded-xl focus:ring-4 focus:ring-pink-300 focus:border-pink-500 focus:outline-none transition bg-pink-50/30">
        </div>

        <div>
          <label for="redes" class="block text-sm font-semibold text-pink-700 mb-1">Redes:</label>
          <input type="text" id="redes" required class="w-full px-4 py-2.5 border-2 border-pink-200 rounded-xl focus:ring-4 focus:ring-pink-300 focus:border-pink-500 focus:outline-none transition bg-pink-50/30">
        </div>

        <div>
          <label for="estudio" class="block text-sm font-semibold text-pink-700 mb-1">Estudio:</label>
          <input type="text" id="estudio" required class="w-full px-4 py-2.5 border-2 border-pink-200 rounded-xl focus:ring-4 focus:ring-pink-300 focus:border-pink-500 focus:outline-none transition bg-pink-50/30">
        </div>

        <div>
          <label for="videojuegos" class="block text-sm font-semibold text-pink-700 mb-1">Videojuegos:</label>
          <input type="text" id="videojuegos" required class="w-full px-4 py-2.5 border-2 border-pink-200 rounded-xl focus:ring-4 focus:ring-pink-300 focus:border-pink-500 focus:outline-none transition bg-pink-50/30">
        </div>

        <div>
          <label for="audifonos" class="block text-sm font-semibold text-pink-700 mb-1">Audifonos:</label>
          <input type="text" id="audifonos" required class="w-full px-4 py-2.5 border-2 border-pink-200 rounded-xl focus:ring-4 focus:ring-pink-300 focus:border-pink-500 focus:outline-none transition bg-pink-50/30">
        </div>

        <div>
          <label for="uso" class="block text-sm font-semibold text-pink-700 mb-1">Uso:</label>
          <select id="uso" required class="w-full px-4 py-2.5 border-2 border-pink-200 rounded-xl focus:ring-4 focus:ring-pink-300 focus:border-pink-500 focus:outline-none transition bg-pink-50/30">
            <option value="" disabled selected>Selecciona una opción...</option>
            <option value="1hora">1 hora</option>
            <option value="2horas">2 horas</option>
            <option value="3horas">3 horas</option>
            <option value="4horas">4 horas</option>
            <option value="mas">Más</option>
          </select>
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="flex flex-wrap gap-3 pt-6">
        <button type="button" id="btnRegistrar" class="flex-1 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-pink-300/50 transition transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">✨ Registrar</button>
        <button type="button" id="btnConsultar" class="flex-1 bg-gradient-to-r from-fuchsia-500 to-purple-500 hover:from-fuchsia-600 hover:to-purple-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-fuchsia-300/50 transition transform hover:-translate-y-0.5">🔍 Consultar</button>
        <button type="button" id="btnModificar" class="flex-1 bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-orange-200/50 transition transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">✏️ Modificar</button>
        <button type="button" id="btnEliminar" class="flex-1 bg-gradient-to-r from-red-500 to-pink-700 hover:from-red-600 hover:to-pink-800 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-red-300/50 transition transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">🗑️ Eliminar</button>
      </div>
    </form>

    <p id="estado" class="mt-4 text-center text-sm font-bold text-pink-600"></p>

    <!-- Sección de Tabla -->
    <div id="seccionTabla" class="mt-8 hidden border-t-2 border-pink-100 pt-6">
      <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-4">
        <h2 class="text-2xl font-bold text-pink-700">📋 Registros</h2>
        <button type="button" id="btnCerrar" class="bg-slate-400 hover:bg-slate-500 text-white text-sm font-semibold py-2 px-4 rounded-xl shadow transition">Cerrar tabla</button>
      </div>

      <input type="text" id="buscador" placeholder="Buscar por nombre..." class="w-full px-4 py-2.5 border-2 border-pink-200 rounded-xl mb-4 focus:ring-4 focus:ring-pink-300 focus:border-pink-500 focus:outline-none transition bg-pink-50/30">

      <div class="overflow-x-auto rounded-2xl border-2 border-pink-100 shadow-lg">
        <table class="w-full text-left border-collapse text-sm">
          <thead class="bg-pink-500 text-white uppercase text-xs tracking-wider">
            <tr>
              <th class="py-3 px-4 border-b border-pink-400">Edad</th>
              <th class="py-3 px-4 border-b border-pink-400">Celular</th>
              <th class="py-3 px-4 border-b border-pink-400">Computadora</th>
              <th class="py-3 px-4 border-b border-pink-400">Tablet</th>
              <th class="py-3 px-4 border-b border-pink-400">Internet</th>
              <th class="py-3 px-4 border-b border-pink-400">Redes</th>
              <th class="py-3 px-4 border-b border-pink-400">Estudio</th>
              <th class="py-3 px-4 border-b border-pink-400">Videojuegos</th>
              <th class="py-3 px-4 border-b border-pink-400">Audifonos</th>
              <th class="py-3 px-4 border-b border-pink-400">Uso</th>
              <th class="py-3 px-4 border-b border-pink-400">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla" class="divide-y divide-pink-100 bg-white"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // Pega aquí la URL de tu implementación de Apps Script
    var URL_SCRIPT = "https://script.google.com/macros/s/AKfycbw4ISviE4LXUrKjA_HeOtE5wmdiIEuHi5KArUqk-63loHSf1c-PZVoEYlhZNRCjSQ0W/exec";
    var registros = [];
    var tablaVisible = false;

    // ---------- Enviar datos al script ----------
    function enviar(datos) {
      return fetch(URL_SCRIPT, {
        method: "POST",
        body: new URLSearchParams(datos)
      }).then(function (r) { return r.json(); });
    }

    // ---------- Botones activos según el estado ----------
    function actualizarBotones() {
      var hayRegistro = document.getElementById("id").value !== "";
      document.getElementById("btnRegistrar").disabled = hayRegistro;
      document.getElementById("btnModificar").disabled = !hayRegistro;
      document.getElementById("btnEliminar").disabled = !hayRegistro;
    }

    function limpiarFormulario() {
      document.getElementById("formulario").reset();
      document.getElementById("id").value = "";
      actualizarBotones();
    }

    // ---------- REGISTRAR ----------
    document.getElementById("btnRegistrar").onclick = function () {
      if (!document.getElementById("formulario").reportValidity()) return;

      document.getElementById("estado").textContent = "Guardando...";
      enviar({
        accion: "guardar",
        edad: document.getElementById("edad").value,
        celular: document.getElementById("celular").value,
        computadora: document.getElementById("computadora").value,
        tablet: document.getElementById("tablet").value,
        internet: document.getElementById("internet").value,
        redes: document.getElementById("redes").value,
        estudio: document.getElementById("estudio").value,
        videojuegos: document.getElementById("videojuegos").value,
        audifonos: document.getElementById("audifonos").value,
        uso: document.getElementById("uso").value
      }).then(function (respuesta) {
        terminarAccion(respuesta, "¡Registro guardado!");
      });
    };

    // ---------- CONSULTAR ----------
    document.getElementById("btnConsultar").onclick = function () {
      document.getElementById("estado").textContent = "Consultando...";
      tablaVisible = true;
      document.getElementById("seccionTabla").style.display = "block";
      cargarRegistros(function () {
        document.getElementById("estado").textContent = "";
      });
    };

    function cargarRegistros(alTerminar) {
      fetch(URL_SCRIPT)
        .then(function (r) { return r.json(); })
        .then(function (datos) {
          registros = datos;
          mostrarTabla();
          if (alTerminar) alTerminar();
        });
    }

    function mostrarTabla() {
      var filtro = document.getElementById("buscador").value.trim().toLowerCase();
      var tabla = document.getElementById("tabla");
      tabla.innerHTML = "";

      registros.forEach(function (reg) {
        if (!reg.nombre.toString().toLowerCase().startsWith(filtro)) return;

        var tr = document.createElement("tr");
        tr.className = "hover:bg-pink-50/50 transition";
        
        agregarCelda(tr, new Date(reg.fecha).toLocaleString());
        agregarCelda(tr, reg.edad);
        agregarCelda(tr, reg.celular);
        agregarCelda(tr, reg.computadora);
        agregarCelda(tr, reg.tablet);
        agregarCelda(tr, reg.internet);
        agregarCelda(tr, reg.redes);
        agregarCelda(tr, reg.estudio);
        agregarCelda(tr, reg.videojuegos);
        agregarCelda(tr, reg.audifonos);
        agregarCelda(tr, reg.uso);

        var td = document.createElement("td");
        td.className = "py-3 px-4 border-b border-pink-100 space-x-2 whitespace-nowrap";

        var btnModificarFila = document.createElement("button");
        btnModificarFila.textContent = "Modificar";
        btnModificarFila.className = "bg-amber-400 hover:bg-amber-500 text-white text-xs font-bold py-1.5 px-3 rounded-lg shadow transition";
        btnModificarFila.onclick = function () { cargarEnFormulario(reg); };

        var btnEliminarFila = document.createElement("button");
        btnEliminarFila.textContent = "Eliminar";
        btnEliminarFila.className = "bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold py-1.5 px-3 rounded-lg shadow transition";
        btnEliminarFila.onclick = function () { eliminar(reg.id); };

        td.appendChild(btnModificarFila);
        td.appendChild(btnEliminarFila);
        tr.appendChild(td);
        tabla.appendChild(tr);
      });
    }

    function agregarCelda(fila, texto) {
      var td = document.createElement("td");
      td.className = "py-3 px-4 border-b border-pink-100 text-slate-700 font-medium";
      td.textContent = texto;
      fila.appendChild(td);
    }

    document.getElementById("buscador").oninput = mostrarTabla;

    // ---------- CERRAR TABLA ----------
    document.getElementById("btnCerrar").onclick = function () {
      tablaVisible = false;
      document.getElementById("seccionTabla").style.display = "none";
      document.getElementById("buscador").value = "";
      document.getElementById("tabla").innerHTML = "";
    };

    // ---------- Pasar el registro al formulario ----------
    function cargarEnFormulario(reg) {
      document.getElementById("id").value = reg.id;
      document.getElementById("edad").value = reg.edad;
      document.getElementById("celular").value = reg.celular;
      document.getElementById("computadora").value = reg.computadora;
      document.getElementById("tablet").value = reg.tablet;
      document.getElementById("internet").value = reg.internet;
      document.getElementById("redes").value = reg.redes;
      document.getElementById("estudio").value = reg.estudio;
      document.getElementById("videojuegos").value = reg.videojuegos;
      document.getElementById("audifonos").value = reg.audifonos;
      document.getElementById("uso").value = reg.uso;

      document.getElementById("estado").textContent = "Modificando registro: cambia los datos y presiona Modificar";
      actualizarBotones();

      window.scrollTo(0, 0);
      document.getElementById("edad").focus();
    }

    // ---------- MODIFICAR ----------
    document.getElementById("btnModificar").onclick = function () {
      var id = document.getElementById("id").value;

      if (id === "") {
        alert("Primero elige un registro con el botón 'Modificar'");
        return;
      }
      if (!document.getElementById("formulario").reportValidity()) return;

      document.getElementById("estado").textContent = "Modificando...";
      enviar({
        accion: "editar",
        id: id,
        edad: document.getElementById("edad").value,
        celular: document.getElementById("celular").value,
        computadora: document.getElementById("computadora").value,
        tablet: document.getElementById("tablet").value,
        internet: document.getElementById("internet").value,
        redes: document.getElementById("redes").value,
        estudio: document.getElementById("estudio").value,
        videojuegos: document.getElementById("videojuegos").value,
        audifonos: document.getElementById("audifonos").value,
        uso: document.getElementById("uso").value
      }).then(function (respuesta) {
        terminarAccion(respuesta, "¡Registro modificado!");
      });
    };

    // ---------- ELIMINAR ----------
    document.getElementById("btnEliminar").onclick = function () {
      eliminar(document.getElementById("id").value);
    };

    function eliminar(id) {
      if (!confirm("¿Seguro que quieres eliminar este registro?")) return;

      document.getElementById("estado").textContent = "Eliminando...";
      enviar({ accion: "eliminar", id: id }).then(function (respuesta) {
        terminarAccion(respuesta, "Registro eliminado");
      });
    }

    // ---------- Mensaje al terminar cualquier acción ----------
    function terminarAccion(respuesta, mensajeOk) {
      document.getElementById("estado").textContent = respuesta.ok ? mensajeOk : "Error: " + respuesta.mensaje;
      limpiarFormulario();
      if (tablaVisible) cargarRegistros();
    }

    actualizarBotones();
  </script>

</body>
</html>
